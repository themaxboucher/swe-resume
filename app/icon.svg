<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!-- Same mark as LogoMark in components/brand.tsx, without the drop shadow under the tile. -->
  <defs>
    <path id="plate" d="M64 0c12.6 0 18.9 0 23.71 2.45a22.5 22.5 0 0 1 9.83 9.83c2.45 4.81 2.45 11.11 2.45 23.71L100 64c0 12.6 0 18.9-2.45 23.71a22.5 22.5 0 0 1-9.83 9.83c-4.81 2.45-11.11 2.45-23.71 2.45L36 100c-12.6 0-18.9 0-23.71-2.45a22.5 22.5 0 0 1-9.83-9.83C0 82.9 0 76.6 0 64L0 36c0-12.6 0-18.9 2.45-23.71a22.5 22.5 0 0 1 9.83-9.83C17.1 0 23.4 0 36 0Z"/>
    <path id="paper" d="M28.5 16h43a4.5 4.5 0 0 1 4.5 4.5V63c-1.4 8.6-11.4 18.6-20 20H28.5a4.5 4.5 0 0 1-4.5-4.5v-58a4.5 4.5 0 0 1 4.5-4.5Z"/>
    <path id="flap" d="M76 63c-1.4 8.6-11.4 18.6-20 20-1.4-6.6-.6-13 3.6-16.2C63.4 63.6 70 62.4 76 63Z"/>
    <path id="prompt" d="M35.5 31.5 46 42 35.5 52.5M51.5 52.5H64" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <linearGradient id="plate-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd2ff"/>
      <stop offset="0.5" stop-color="#2a9df4"/>
      <stop offset="1" stop-color="#1d5fe4"/>
    </linearGradient>
    <radialGradient id="dusk" cx="1" cy="1" r="0.85">
      <stop offset="0" stop-color="#5b4dff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0a3fb8" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a3fb8" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.3" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="paper-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#eaf0fa"/>
    </linearGradient>
    <radialGradient id="tint" cx="0.15" cy="1" r="0.9">
      <stop offset="0" stop-color="#d6e2fb"/>
      <stop offset="1" stop-color="#d6e2fb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flap-fill" gradientUnits="userSpaceOnUse" x1="68" y1="75" x2="58" y2="65">
      <stop offset="0" stop-color="#a9bce8"/>
      <stop offset="0.22" stop-color="#d9e2f8"/>
      <stop offset="0.48" stop-color="#fff"/>
      <stop offset="0.78" stop-color="#e9e7fc"/>
      <stop offset="1" stop-color="#bccbef"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="28" x2="0" y2="56">
      <stop offset="0" stop-color="#34acfa"/>
      <stop offset="1" stop-color="#1350d8"/>
    </linearGradient>
    <clipPath id="clip"><use href="#plate"/></clipPath>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#062a72" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.7" flood-color="#062a72" flood-opacity="0.3"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="curl" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-0.6" dy="-0.4" stdDeviation="1.4" flood-color="#0a2a6a" flood-opacity="0.3"/>
    </filter>
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="0.7"/>
      <feOffset dy="1.1" result="offset"/>
      <feFlood flood-color="#06307e" flood-opacity="0.7"/>
      <feComposite in2="offset" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="inner"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/></feMerge>
    </filter>
  </defs>
  <use href="#plate" fill="url(#plate-fill)"/>
  <g clip-path="url(#clip)">
    <use href="#plate" fill="url(#dusk)"/>
    <use href="#plate" fill="url(#floor)"/>
    <use href="#plate" fill="url(#bloom)"/>
    <use href="#plate" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <use href="#flap" fill="#062a72" fill-opacity="0.45" transform="translate(3.2 4)" filter="url(#soft)"/>
  <use href="#paper" fill="url(#paper-fill)" filter="url(#lift)"/>
  <use href="#paper" fill="url(#tint)" fill-opacity="0.7"/>
  <use href="#prompt" stroke="#fff" transform="translate(0 0.9)"/>
  <use href="#prompt" stroke="url(#ink)" filter="url(#inset)"/>
  <use href="#flap" fill="url(#flap-fill)" filter="url(#curl)"/>
  <use href="#flap" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="0.5" stroke-linejoin="round"/>
</svg>
