<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1 22 22" width="64" height="64">
  <!-- Same mark as LogoMark in components/brand.tsx, cropped to the page and without the drop shadow. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7ad7ff"/>
      <stop offset="0.55" stop-color="#21a6f3"/>
      <stop offset="1" stop-color="#0c87dc"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.46" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#035a9e" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f6ff"/>
      <stop offset="1" stop-color="#8fd3fb"/>
    </linearGradient>
    <filter id="emboss" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.35" flood-color="#022f5c" flood-opacity="0.45"/>
    </filter>
    <path id="page" d="M7 1.5h7.4L20.5 7.6V20a2.5 2.5 0 0 1-2.5 2.5H7A2.5 2.5 0 0 1 4.5 20V4A2.5 2.5 0 0 1 7 1.5Z"/>
  </defs>
  <use href="#page" fill="url(#body)"/>
  <use href="#page" fill="url(#gloss)"/>
  <use href="#page" fill="none" stroke="url(#rim)" stroke-width="0.7"/>
  <path d="M14.4 1.5v4.5a1.6 1.6 0 0 0 1.6 1.6h4.5Z" fill="url(#fold)" stroke="#fff" stroke-opacity="0.6" stroke-width="0.4" stroke-linejoin="round" filter="url(#emboss)"/>
  <path d="M8.25 10.75 11.5 14l-3.25 3.25M13.5 17.25h3" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#emboss)"/>
